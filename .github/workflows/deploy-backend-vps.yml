name: Build Image And Deploy Backend

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "web/**"
      - "new-api-docs/**"
      - "**/*.md"
      - ".github/workflows/deploy-frontend-pages.yml"
  workflow_dispatch:
    inputs:
      readonly_probe:
        description: "Read-only production metadata and redacted polling diagnostics; never build or deploy"
        required: false
        type: boolean
        default: false
      registry_target:
        description: "Registry for this deployment"
        required: false
        type: choice
        default: tcr
        options:
          - tcr
          - ghcr
      existing_image_sha:
        description: "Full commit SHA of an already-pushed image; leave empty to build"
        required: false
        type: string
      deploy_transport:
        description: "How to transfer the image to the production host"
        required: false
        type: choice
        default: registry
        options:
          - registry
          - ssh_stream

jobs:
  build_and_push:
    if: ${{ inputs.readonly_probe != true }}
    environment: Guangzhou
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: tags
        env:
          SHA_TAG: ${{ inputs.existing_image_sha || github.sha }}
          EXISTING_IMAGE_SHA: ${{ inputs.existing_image_sha }}
          GH_OWNER: ${{ github.repository_owner }}
          REGISTRY_TARGET_SECRET: ${{ inputs.registry_target || secrets.REGISTRY_TARGET }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ secrets.ACR_REPOSITORY }}
          TCR_REGISTRY: ${{ secrets.TCR_REGISTRY }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          TCR_NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
          TCR_REPOSITORY: ${{ secrets.TCR_REPOSITORY }}
        run: |
          set -euo pipefail
          if [ -n "${EXISTING_IMAGE_SHA}" ] && ! [[ "${EXISTING_IMAGE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "existing_image_sha must be a full commit SHA" >&2
            exit 1
          fi
          target_raw="${REGISTRY_TARGET_SECRET:-ghcr}"
          target="$(echo "${target_raw}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${SHA_TAG:0:12}"
          tags=()
          push_ghcr="false"
          push_acr="false"
          push_tcr="false"

          ghcr_image="ghcr.io/${GH_OWNER}/new-api:${short_sha}"
          ghcr_latest="ghcr.io/${GH_OWNER}/new-api:latest"
          acr_image="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}:${short_sha}"
          acr_latest="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}:latest"
          tcr_image="${TCR_REGISTRY}/${TCR_NAMESPACE}/${TCR_REPOSITORY}:${short_sha}"
          tcr_latest="${TCR_REGISTRY}/${TCR_NAMESPACE}/${TCR_REPOSITORY}:latest"
          deploy_image="${ghcr_image}"

          case "${target}" in
            ghcr|"")
              push_ghcr="true"
              tags+=("${ghcr_image}")
              tags+=("${ghcr_latest}")
              deploy_image="${ghcr_image}"
              ;;
            acr)
              if [ -z "${ACR_REGISTRY}" ] || [ -z "${ACR_USERNAME}" ] || [ -z "${ACR_PASSWORD}" ] || [ -z "${ACR_NAMESPACE}" ] || [ -z "${ACR_REPOSITORY}" ]; then
                echo "REGISTRY_TARGET=acr but ACR_* is incomplete (need REGISTRY/USERNAME/PASSWORD/NAMESPACE/REPOSITORY)" >&2
                exit 1
              fi
              push_acr="true"
              tags+=("${acr_image}")
              tags+=("${acr_latest}")
              deploy_image="${acr_image}"
              ;;
            tcr)
              if [ -z "${TCR_REGISTRY}" ] || [ -z "${TCR_USERNAME}" ] || [ -z "${TCR_PASSWORD}" ] || [ -z "${TCR_NAMESPACE}" ] || [ -z "${TCR_REPOSITORY}" ]; then
                echo "REGISTRY_TARGET=tcr but TCR_* is incomplete (need REGISTRY/USERNAME/PASSWORD/NAMESPACE/REPOSITORY)" >&2
                exit 1
              fi
              push_tcr="true"
              tags+=("${tcr_image}")
              tags+=("${tcr_latest}")
              deploy_image="${tcr_image}"
              ;;
            all)
              push_ghcr="true"
              tags+=("${ghcr_image}")
              tags+=("${ghcr_latest}")
              if [ -n "${ACR_REGISTRY}" ] && [ -n "${ACR_NAMESPACE}" ] && [ -n "${ACR_REPOSITORY}" ]; then
                push_acr="true"
                tags+=("${acr_image}")
                tags+=("${acr_latest}")
              fi
              if [ -n "${TCR_REGISTRY}" ] && [ -n "${TCR_NAMESPACE}" ] && [ -n "${TCR_REPOSITORY}" ]; then
                push_tcr="true"
                tags+=("${tcr_image}")
                tags+=("${tcr_latest}")
              fi
              deploy_image="${ghcr_image}"
              ;;
            *)
              echo "Unsupported REGISTRY_TARGET=${target}. Use ghcr|acr|tcr|all." >&2
              exit 1
              ;;
          esac

          {
            echo "all_tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "ghcr_image=${ghcr_image}" >> "$GITHUB_OUTPUT"
          echo "acr_image=${acr_image}" >> "$GITHUB_OUTPUT"
          echo "tcr_image=${tcr_image}" >> "$GITHUB_OUTPUT"
          echo "push_ghcr=${push_ghcr}" >> "$GITHUB_OUTPUT"
          echo "push_acr=${push_acr}" >> "$GITHUB_OUTPUT"
          echo "push_tcr=${push_tcr}" >> "$GITHUB_OUTPUT"
          echo "target=${target}" >> "$GITHUB_OUTPUT"
          echo "deploy_image=${deploy_image}" >> "$GITHUB_OUTPUT"

      - name: Show push decision
        run: |
          echo "registry_target=${{ steps.tags.outputs.target }}"
          echo "push_ghcr=${{ steps.tags.outputs.push_ghcr }}"
          echo "push_acr=${{ steps.tags.outputs.push_acr }}"
          echo "push_tcr=${{ steps.tags.outputs.push_tcr }}"
          echo "deploy_image=${{ steps.tags.outputs.deploy_image }}"
          echo "all_tags:"
          echo "${{ steps.tags.outputs.all_tags }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        if: ${{ steps.tags.outputs.push_ghcr == 'true' || inputs.existing_image_sha != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login ACR
        if: ${{ steps.tags.outputs.push_acr == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login TCR
        if: ${{ steps.tags.outputs.push_tcr == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push image
        if: ${{ inputs.existing_image_sha == '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.all_tags }}

      - name: Mirror existing GHCR image to TCR
        if: ${{ inputs.existing_image_sha != '' && steps.tags.outputs.target == 'tcr' }}
        shell: bash
        env:
          GHCR_IMAGE: ${{ steps.tags.outputs.ghcr_image }}
          TCR_IMAGE: ${{ steps.tags.outputs.tcr_image }}
        run: |
          set -euo pipefail
          docker pull "$GHCR_IMAGE"
          docker tag "$GHCR_IMAGE" "$TCR_IMAGE"
          timeout 20m docker push "$TCR_IMAGE"

  deploy_vps:
    if: ${{ inputs.readonly_probe != true }}
    environment: Guangzhou
    needs: build_and_push
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute deploy image
        id: deploy_meta
        env:
          SHA_TAG: ${{ inputs.existing_image_sha || github.sha }}
          GH_OWNER: ${{ github.repository_owner }}
          REGISTRY_TARGET_SECRET: ${{ inputs.registry_target || secrets.REGISTRY_TARGET }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ secrets.ACR_REPOSITORY }}
          TCR_REGISTRY: ${{ secrets.TCR_REGISTRY }}
          TCR_NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
          TCR_REPOSITORY: ${{ secrets.TCR_REPOSITORY }}
        run: |
          set -euo pipefail
          short_sha="${SHA_TAG:0:12}"
          target_raw="${REGISTRY_TARGET_SECRET:-ghcr}"
          target="$(echo "${target_raw}" | tr '[:upper:]' '[:lower:]')"
          ghcr_image="ghcr.io/${GH_OWNER}/new-api:${short_sha}"
          acr_image="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}:${short_sha}"
          tcr_image="${TCR_REGISTRY}/${TCR_NAMESPACE}/${TCR_REPOSITORY}:${short_sha}"
          deploy_image="${ghcr_image}"
          push_acr="false"
          push_tcr="false"

          case "${target}" in
            ghcr|"")
              deploy_image="${ghcr_image}"
              ;;
            acr)
              deploy_image="${acr_image}"
              push_acr="true"
              ;;
            tcr)
              deploy_image="${tcr_image}"
              push_tcr="true"
              ;;
            all)
              deploy_image="${ghcr_image}"
              if [ -n "${ACR_REGISTRY}" ] && [ -n "${ACR_NAMESPACE}" ] && [ -n "${ACR_REPOSITORY}" ]; then
                push_acr="true"
              fi
              if [ -n "${TCR_REGISTRY}" ] && [ -n "${TCR_NAMESPACE}" ] && [ -n "${TCR_REPOSITORY}" ]; then
                push_tcr="true"
              fi
              ;;
            *)
              echo "Unsupported REGISTRY_TARGET=${target}. Use ghcr|acr|tcr|all." >&2
              exit 1
              ;;
          esac

          echo "deploy_image=${deploy_image}" >> "$GITHUB_OUTPUT"
          echo "push_acr=${push_acr}" >> "$GITHUB_OUTPUT"
          echo "push_tcr=${push_tcr}" >> "$GITHUB_OUTPUT"

      - name: Validate deploy image input
        run: |
          if [ -z "${{ steps.deploy_meta.outputs.deploy_image }}" ]; then
            echo "steps.deploy_meta.outputs.deploy_image is empty" >&2
            exit 1
          fi
          echo "deploy_image=${{ steps.deploy_meta.outputs.deploy_image }}"
          echo "push_acr=${{ steps.deploy_meta.outputs.push_acr }}"
          echo "push_tcr=${{ steps.deploy_meta.outputs.push_tcr }}"

      - name: Log in to GHCR for image transfer
        if: ${{ inputs.deploy_transport == 'ssh_stream' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare SSH key for image transfer
        if: ${{ inputs.deploy_transport == 'ssh_stream' }}
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/newapi_image_transfer"
          chmod 600 "$HOME/.ssh/newapi_image_transfer"
          ssh-keygen -y -f "$HOME/.ssh/newapi_image_transfer" >/dev/null

      - name: Transfer GHCR image in resumable chunks
        if: ${{ inputs.deploy_transport == 'ssh_stream' }}
        shell: bash
        env:
          DEPLOY_IMAGE: ${{ steps.deploy_meta.outputs.deploy_image }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: bash .github/scripts/transfer-image-chunks.sh

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_IMAGE: ${{ steps.deploy_meta.outputs.deploy_image }}
          PUSH_ACR: ${{ steps.deploy_meta.outputs.push_acr }}
          PUSH_TCR: ${{ steps.deploy_meta.outputs.push_tcr }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_PULL: ${{ inputs.deploy_transport == 'ssh_stream' && 'true' || 'false' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 45m
          envs: DEPLOY_IMAGE,PUSH_ACR,PUSH_TCR,GHCR_USER,GHCR_TOKEN,SKIP_PULL
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            if [ "${PUSH_ACR}" = "true" ] && [[ "${DEPLOY_IMAGE}" == "${{ secrets.ACR_REGISTRY }}"* ]]; then
              docker login "${{ secrets.ACR_REGISTRY }}" -u "${{ secrets.ACR_USERNAME }}" -p "${{ secrets.ACR_PASSWORD }}"
            fi
            if [ "${PUSH_TCR}" = "true" ] && [[ "${DEPLOY_IMAGE}" == "${{ secrets.TCR_REGISTRY }}"* ]]; then
              docker login "${{ secrets.TCR_REGISTRY }}" -u "${{ secrets.TCR_USERNAME }}" -p "${{ secrets.TCR_PASSWORD }}"
            fi
            if [[ "${DEPLOY_IMAGE}" == ghcr.io/* && "${SKIP_PULL}" != "true" ]]; then
              printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            fi

            image_no_tag="${DEPLOY_IMAGE%:*}"
            image_tag="${DEPLOY_IMAGE##*:}"
            image_registry="${image_no_tag%%/*}"
            image_repo_path="${image_no_tag#*/}"
            image_namespace="${image_repo_path%/*}"
            image_repository="${image_repo_path##*/}"

            if [ -z "${image_registry}" ] || [ -z "${image_namespace}" ] || [ -z "${image_repository}" ] || [ -z "${image_tag}" ]; then
              echo "Invalid DEPLOY_IMAGE: ${DEPLOY_IMAGE}" >&2
              exit 1
            fi

            export IMAGE_REGISTRY="${image_registry}"
            export IMAGE_NAMESPACE="${image_namespace}"
            export IMAGE_REPOSITORY="${image_repository}"
            export IMAGE_TAG="${image_tag}"
            if [ "${SKIP_PULL}" = "true" ]; then
              docker image inspect "${DEPLOY_IMAGE}" >/dev/null
            else
              docker compose pull new-api
            fi
            docker compose up -d --no-build --pull never new-api
            docker compose ps

  readonly_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.readonly_probe == true }}
    environment: Guangzhou
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Read production metadata and redacted polling facts
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 6m
          script: |
            python3 -I -S -B - <<'READONLY_PY'
            """Fixed production metadata/log probe. Never import or call an application."""
            import hashlib
            import json
            import os
            import re
            import selectors
            import subprocess
            import time

            SINCE = '2026-10-30T17:00:00Z'
            UNTIL = '2026-10-30T17:10:00Z'
            TARGETS = {
                'newapi_task_1': 'task_9ySxI4jq4TJTHKoZITazbRorCzg0eCes',
                'newapi_task_2': 'task_MbW16Di6kzgpib1KTPoPqdfHhF6e95fC',
                'lingya_task_1': '5618ee1eadf0413482a231eb30133df6',
                'lingya_task_2': 'c01db8ea18b74c3c8d4e2bfe781f3316',
            }
            FILES = """import glob,hashlib,json,pathlib,re
            def fingerprint(path):
             checksum=hashlib.sha256()
             with path.open('rb') as stream:
              for chunk in iter(lambda:stream.read(1048576),b''):checksum.update(chunk)
             return checksum.hexdigest()
            roots=[pathlib.Path('/app/litellm'),pathlib.Path('/app/litellm/litellm')]
            roots += [pathlib.Path(p) for p in glob.glob('/usr/local/lib/python*/site-packages/litellm')[:12]]
            roots += [pathlib.Path(p) for p in glob.glob('/usr/lib/python*/site-packages/litellm')[:12]]
            roots += [pathlib.Path(p) for p in glob.glob('/opt/venv/lib/python*/site-packages/litellm')[:4]]
            relative=['videos/main.py','litellm_core_utils/exception_mapping_utils.py','llms/lyapi/videos/transformation.py','llms/custom_httpx/llm_http_handler.py','proxy/video_endpoints/endpoints.py']
            facts=[]
            for root in roots:
             for name in relative:
              path=root/name
              if path.is_file() and not path.is_symlink():facts.append({'path':str(path),'bytes':path.stat().st_size,'sha256':fingerprint(path)})
            versions=[]
            paths=[pathlib.Path('/app/VERSION'),pathlib.Path('/app/pyproject.toml')]
            paths += [root/'_version.py' for root in roots]
            paths += [pathlib.Path(p) for p in glob.glob('/usr/local/lib/python*/site-packages/litellm-*.dist-info/METADATA')[:12]]
            paths += [pathlib.Path(p) for p in glob.glob('/usr/lib/python*/site-packages/litellm-*.dist-info/METADATA')[:12]]
            for path in paths:
             if not path.is_file() or path.is_symlink() or path.stat().st_size>2097152:continue
             text=path.read_text(encoding='utf-8',errors='replace')
             match=re.search(r'(?m)^Version:\\s*([0-9][A-Za-z0-9.+_-]{0,79})$',text)
             if match is None:match=re.search(r'''(?:__version__|version)\\s*=\\s*["']([0-9][A-Za-z0-9.+_-]{0,79})["']''',text)
             if match is None:match=re.fullmatch(r'\\s*([0-9][A-Za-z0-9.+_-]{0,79})\\s*',text)
             versions.append({'path':str(path),'sha256':fingerprint(path),'version':match.group(1) if match else None})
            print(json.dumps({'source_files':facts,'version_files':versions}))
            """


            def capture(args, *, source=None, maximum=8 * 1024 * 1024, seconds=25):
                assert args[0] == 'docker' and args[1] in {'ps', 'inspect', 'image', 'logs', 'exec'}
                if args[1] == 'exec':
                    assert args[:3] == ['docker', 'exec', '-i'] and args[4:] == ['python', '-I', '-S', '-B', '-'] and source == FILES
                process = subprocess.Popen(args, stdin=subprocess.PIPE if source else subprocess.DEVNULL,
                    stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                output = bytearray()
                deadline = time.monotonic() + seconds
                limited = False
                try:
                    if source:
                        process.stdin.write(source.encode())
                        process.stdin.close()
                    with selectors.DefaultSelector() as selector:
                        selector.register(process.stdout, selectors.EVENT_READ)
                        while selector.get_map():
                            if time.monotonic() >= deadline:
                                limited = True
                                break
                            for key, _ in selector.select(min(0.25, max(0, deadline - time.monotonic()))):
                                chunk = os.read(key.fileobj.fileno(), 65536)
                                if not chunk:
                                    selector.unregister(key.fileobj)
                                    continue
                                remaining = maximum - len(output)
                                output.extend(chunk[:remaining])
                                if len(chunk) > remaining:
                                    limited = True
                                    break
                            if limited:
                                break
                finally:
                    if process.poll() is None:
                        try:
                            process.wait(timeout=0.5 if not limited else 0)
                        except subprocess.TimeoutExpired:
                            # Only stop this probe's own bounded docker reader/exec client.
                            process.kill()
                    process.wait(timeout=3)
                    process.stdout.close()
                return {'returncode': process.returncode, 'bounded_or_truncated': limited,
                        'captured_bytes': len(output), 'sha256': hashlib.sha256(output).hexdigest(), 'raw': bytes(output)}


            def json_read(args, **kwargs):
                result = capture(args, **kwargs)
                if result['returncode'] or result['bounded_or_truncated']:
                    return None
                try:
                    return json.loads(result['raw'])
                except (ValueError, UnicodeError):
                    return None


            def image_reference(value):
                return value if isinstance(value, str) and re.fullmatch(r'[A-Za-z0-9._:/@-]{1,512}', value) else None


            def log_facts(name):
                result = capture(['docker', 'logs', '--timestamps', '--since', SINCE, '--until', UNTIL, '--tail', '4000', name])
                raw = result.pop('raw')
                text = raw.decode('utf-8', errors='replace')
                result.update(since=SINCE, until=UNTIL, maximum_tail_lines=4000,
                    exact_task_marker_counts={key: text.count(value) for key, value in TARGETS.items()},
                    text_marker_counts={key: text.lower().count(key.lower()) for key in (
                        'Cloudflare', 'Traceback (most recent call last)', 'APIConnectionError', 'APIError',
                        'AttributeError', 'TypeError', 'HTTPStatusError', 'InternalServerError', 'ServiceUnavailable',
                        'JSONDecodeError', 'ReadTimeout', 'ConnectTimeout', 'retry', 'poll')},
                    status_marker_counts={code: len(re.findall(r'(?<![0-9])' + code + r'(?![0-9])', text))
                        for code in ('500', '502', '503', '504', '520', '521', '522', '523', '524', '530')})
                frames = set()
                for path, line, function in re.findall(r'''File ["'](/(?:app|usr/(?:local/)?lib)/[A-Za-z0-9_./-]{1,260}\.py)["'], line ([0-9]{1,7}), in ([A-Za-z0-9_<>.]{1,100})''', text):
                    frames.add((path, int(line), function))
                result['traceback_frames'] = [{'file': path, 'line': line, 'function': function} for path, line, function in sorted(frames)[:80]]
                result['traceback_frames_truncated'] = len(frames) > 80
                return result


            def main():
                listing = capture(['docker', 'ps', '--all', '--format', '{{.Names}}'], maximum=65536, seconds=10)
                if listing['returncode'] or listing['bounded_or_truncated']:
                    raise RuntimeError('DockerPermissionDenied' if b'permission denied' in listing['raw'].lower()
                                       else 'ContainerDiscoveryUnavailable')
                names = [value for value in listing['raw'].decode().splitlines()
                         if re.fullmatch(r'(?:[A-Za-z0-9_.-]+[-_])?(?:new-api|litellm)(?:[-_][0-9]+)?', value)]
                if not names or len(names) > 6:
                    raise RuntimeError('ContainerSelectionNotUniqueEnough')
                containers = []
                for name in names:
                    inspection = json_read(['docker', 'inspect', name], maximum=1024 * 1024, seconds=10)
                    if not isinstance(inspection, list) or len(inspection) != 1:
                        containers.append({'name': name, 'inspection_unavailable': True})
                        continue
                    value = inspection[0]
                    state, config = value.get('State') or {}, value.get('Config') or {}
                    image = json_read(['docker', 'image', 'inspect', value['Image']], maximum=1024 * 1024, seconds=10)
                    image = image[0] if isinstance(image, list) and len(image) == 1 else {}
                    labels = (image.get('Config') or {}).get('Labels') or {}
                    revision = labels.get('org.opencontainers.image.revision')
                    item = {'name': name, 'image': image_reference(config.get('Image')), 'image_id': image_reference(value.get('Image')),
                        'repo_digests': [image_reference(x) for x in image.get('RepoDigests') or [] if image_reference(x)],
                        'revision_label': revision if isinstance(revision, str) and re.fullmatch(r'[a-fA-F0-9]{7,64}', revision) else None,
                        'status': state.get('Status'), 'running': state.get('Running'),
                        'health': (state.get('Health') or {}).get('Status'),
                        'mounts': [{key: mount.get(key) for key in ('Type', 'Source', 'Destination', 'RW', 'Name')}
                            for mount in value.get('Mounts') or []], 'log_facts': log_facts(name)}
                    if 'litellm' in name:
                        item['python_source'] = json_read(['docker', 'exec', '-i', name, 'python', '-I', '-S', '-B', '-'], source=FILES, seconds=15)
                    containers.append(item)
